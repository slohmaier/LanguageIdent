[build-system]
requires = ["setuptools~=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LangDetectSpeech"
dynamic = ["version"]
description = "NVDA add-on that detects the language of spoken text and switches to the appropriate synthesizer voice"
requires-python = ">=3.13,<3.14"
dependencies = []
# This package is not installed as a library; every dependency is tooling used to
# build and translate the add-on. They are declared as PEP 735 dependency groups.
[dependency-groups]
# Build add-on
build = [
	"scons==4.10.1",
	"Markdown==3.10",
]
# Translations management (Crowdin)
l10n = [
	"crowdin-api-client==1.24.1",
	"lxml==6.1.0",
	"nh3==0.3.2",
	"mdx_truly_sane_lists==1.3",
	"markdown-link-attr-modifier==0.2.1",
	"mdx-gh-links==0.4",
]
dev = [
	{ include-group = "build" },
	{ include-group = "l10n" },
]
